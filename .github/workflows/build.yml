name: Build Swiss Army Knife Pro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Project Structure, Fixed Keystore, Widget XMLs & Manifest
        run: |
          mkdir -p app/src/main/java/com/example/calculator
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/keystore

          # 1. יצירת Keystore קבוע לחלוטין כדי שכל עדכון יותקן כעדכון ישיר בלי למחוק את האפליקציה
          echo "" | base64 -d > app/keystore/fixed_app.p12

          # 2. העתקת כל קובצי ה-Kotlin לתיקיית החבילה הנכונה
          find . -maxdepth 3 -name "*.kt" -not -path "./app/src/main/java/com/example/calculator/*" -exec cp {} app/src/main/java/com/example/calculator/ \;

          # מניעת כפילות אם קיימים גם ProLabAndScienceTools.kt וגם ProInteractiveTools.kt
          if [ -f "app/src/main/java/com/example/calculator/ProLabAndScienceTools.kt" ] && [ -f "app/src/main/java/com/example/calculator/ProInteractiveTools.kt" ]; then
            if grep -q "createProCanvaHeader" "app/src/main/java/com/example/calculator/ProInteractiveTools.kt"; then
              if grep -q "CompassHomeWidgetProvider" "app/src/main/java/com/example/calculator/ProInteractiveTools.kt" && ! grep -q "CompassHomeWidgetProvider" "app/src/main/java/com/example/calculator/ProLabAndScienceTools.kt"; then
                rm -f "app/src/main/java/com/example/calculator/ProLabAndScienceTools.kt"
              else
                rm -f "app/src/main/java/com/example/calculator/ProInteractiveTools.kt"
              fi
            fi
          fi

          # 3. העתקת קובצי סאונד ל-res/raw עם המרה לאותיות קטנות בלבד (מונע שגיאות קומפילציה ב-aapt2)
          for f in $(find . -maxdepth 3 \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.ogg" \) -not -path "./app/src/main/res/raw/*"); do
            base=$(basename "$f")
            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.]//g')
            if [[ ! "$lower" =~ ^[a-z] ]]; then
              lower="snd_$lower"
            fi
            cp "$f" "app/src/main/res/raw/$lower"
          done

          # אם קיים sound1.mp3 אך חסר ac_sound.mp3, ניצור עותק לגיבוי
          if [ -f "app/src/main/res/raw/sound1.mp3" ] && [ ! -f "app/src/main/res/raw/ac_sound.mp3" ] && [ ! -f "app/src/main/res/raw/ac_sound.wav" ]; then
            cp "app/src/main/res/raw/sound1.mp3" "app/src/main/res/raw/ac_sound.mp3"
          fi

          # 4. יצירת קובץ ה-Layout של וידג'ט המצפן הפעיל למסך הבית
          cat << 'EOF' > app/src/main/res/layout/compass_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="2dp">

              <ImageView
                  android:id="@+id/widget_compass_img"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitCenter"
                  android:adjustViewBounds="true"
                  android:contentDescription="מצפן 3D חי" />

          </FrameLayout>
          EOF

          # 5. יצירת קובץ ההגדרות של וידג'ט המצפן (כולל תמיכה במגירת הווידג'טים של כל הלאנצ'רים)
          cat << 'EOF' > app/src/main/res/xml/compass_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="150dp"
              android:minHeight="150dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/compass_widget_layout"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          # 6. יצירת AndroidManifest.xml מלא וסופי (כולל הווידג'ט, חלון צף PiP ואריח וילון התראות)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.calculator">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="אולר שווייצרי Pro fx-991"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="ACTION_CALC" />
                          <action android:name="ACTION_SCI" />
                          <action android:name="ACTION_COIN" />
                          <action android:name="ACTION_OPEN_COMPASS" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MiniCalcTileService"
                      android:exported="true"
                      android:icon="@android:drawable/ic_dialog_dialer"
                      android:label="מיני מחשבון"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".CompassHomeWidgetProvider"
                      android:exported="true"
                      android:label="מצפן 3D חי (Canva Pro)">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.example.calculator.ACTION_REFRESH_COMPASS_WIDGET" />
                          <action android:name="android.intent.action.USER_PRESENT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/compass_widget_info" />
                  </receiver>

              </application>
          </manifest>
          EOF

          # 7. יצירת settings.gradle ו-build.gradle ראשיים
          cat << 'EOF' > settings.gradle
          rootProject.name = "SwissArmyKnifePro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.2.2"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 8. יצירת app/build.gradle עם חתימה קבועה ומספר גרסה עולה אוטומטית (לעדכון חלק ללא הסרת התקנה!)
          RUN_NUM=${{ github.run_number }}
          VER_CODE=$((1000 + RUN_NUM))

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.calculator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.calculator"
                  minSdk 24
                  targetSdk 34
                  versionCode $VER_CODE
                  versionName "2.0.$RUN_NUM"
              }

              signingConfigs {
                  fixedConfig {
                      storeFile file("keystore/fixed_app.p12")
                      storePassword "calcpro123"
                      keyAlias "calcprokey"
                      keyPassword "calcpro123"
                      storeType "PKCS12"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixedConfig
                      minifyEnabled false
                  }
                  release {
                      signingConfig signingConfigs.fixedConfig
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
          }
          EOF

      - name: Build Signed APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiss-Army-Knife-Pro-fx991-APK
          path: app/build/outputs/apk/debug/app-debug.apk
